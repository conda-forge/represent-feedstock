{% set name = "Represent" %}
{% set version = "2.2.0" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: 403daa7f8360390b84b143b7bf1dd720965a3e93a234994923c7123cc55d5fe1

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - represent
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/RazerM/represent
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 'Create __repr__ automatically or declaratively.'

  description: |
    Create __repr__ automatically or declaratively.
  doc_url: https://github.com/RazerM/represent
  dev_url: https://github.com/RazerM/represent

extra:
  recipe-maintainers:
    - simonvh
    - zxdawn
